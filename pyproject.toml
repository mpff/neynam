[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neynam"
version = "0.1.0"
description = "Minimal neural additive model — testbed for a new NAM optimization routine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neynam*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
